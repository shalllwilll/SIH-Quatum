version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: abraxas-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abraxas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/logistics_db
      - APP_ENV=production
      - JWT_SECRET=abraxas_production_jwt_secret_key_demo_2026
      - CLOCK_ACCELERATION_RATIO=60.0
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
